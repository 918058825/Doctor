<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号开通 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --accent: #059669;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem 1rem;
}
a { color: inherit; text-decoration: none; }
.back {
  position: fixed; top: 1.2rem; left: 1.5rem;
  font-size: .83rem; color: var(--muted);
  padding: .38rem .85rem; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  transition: color .15s;
}
.back:hover { color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
  text-align: center;
}
.icon { font-size: 3rem; margin-bottom: 1rem; }
h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: .6rem; }
.desc {
  color: var(--muted); font-size: .88rem; line-height: 1.8;
  margin-bottom: 2rem;
}
.info-box {
  background: rgba(5,150,105,.1); border: 1px solid rgba(5,150,105,.3);
  border-radius: 10px; padding: 1.1rem 1.2rem;
  font-size: .85rem; line-height: 1.8; margin-bottom: 1.8rem;
  text-align: left;
}
.info-box .label { color: #6ee7b7; font-weight: 700; font-size: .75rem;
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
.info-box .val { color: var(--text); }
.btn {
  display: block; width: 100%; padding: .88rem;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s; font-family: inherit;
  background: var(--accent); color: white; text-decoration: none;
  text-align: center;
}
.btn:hover { opacity: .88; }
.login-link {
  margin-top: 1.2rem; font-size: .84rem; color: var(--muted);
}
.login-link a { color: #7dd3fc; }
.login-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<a class="back" href="index.html">← 返回首页</a>

<div class="card">
  <div class="icon">🔐</div>
  <h1>账号由管理员开通</h1>
  <p class="desc">本平台不开放自助注册<br>购课后，账号将由管理员为你创建并发送</p>

  <div class="info-box">
    <div class="label">购课 / 咨询渠道</div>
    <div class="val">� 搜索「求学少年」<br>
    📣 公众号：求学少年<br>
    📧 邮件：bitw@foxmail.com</div>
  </div>

  <a href="login.html" class="btn">已有账号，去登录 →</a>
  <div class="login-link">购课后收到账号再来登录即可</div>
</div>

</body>
</html>
