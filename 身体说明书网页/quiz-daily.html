<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一题 · 身体说明书</title>
<link rel="stylesheet" href="style.css">
<style>
.quiz-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:1.5rem;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.quiz-header{padding:0.9rem 1.2rem;display:flex;align-items:center;gap:0.6rem;border-bottom:1px solid #f3f4f6}
.quiz-num{background:var(--c-green);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;flex-shrink:0}
.quiz-subj{font-size:0.75rem;padding:2px 10px;border-radius:10px;font-weight:600}
.qs-anatomy{background:#dbeafe;color:#1e40af}
.qs-physiology{background:#d1fae5;color:#047857}
.qs-pathology{background:#fee2e2;color:#991b1b}
.qs-pharmacology{background:#f3e8ff;color:#7c3aed}
.quiz-body{padding:1.2rem}
.quiz-question{font-size:0.95rem;font-weight:600;color:#1f2937;margin-bottom:1rem;line-height:1.7}
.quiz-options{list-style:none;padding:0;margin:0}
.quiz-options li{padding:0.6rem 1rem;margin-bottom:0.5rem;border-radius:8px;border:1px solid #e5e7eb;cursor:pointer;transition:all .2s;font-size:0.88rem;line-height:1.5}
.quiz-options li:hover:not(.correct):not(.wrong){border-color:var(--c-green);background:#f0fdf4}
.quiz-options li.correct{border-color:#16a34a;background:#bbf7d0;font-weight:600;cursor:default}
.quiz-options li.wrong{border-color:#dc2626;background:#fecaca;cursor:default}
.quiz-answer{display:none;padding:1rem 1.2rem;background:#f8fafc;border-top:1px solid #f3f4f6}
.quiz-answer.show{display:block}
.answer-label{font-weight:700;color:#16a34a;margin-bottom:0.5rem;font-size:0.9rem}
.answer-explain{font-size:0.85rem;color:#374151;line-height:1.8}
.answer-explain strong{color:#059669}
/* 顶部状态栏 */
.quiz-status{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:1rem 1.2rem;margin:1.2rem 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.6rem}
.status-score{font-size:1.6rem;font-weight:800;color:var(--c-green)}
.status-info{color:#6b7280;font-size:0.82rem;margin-top:0.1rem}
.btn-refresh{padding:0.5rem 1.2rem;background:var(--c-green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.84rem;font-weight:600;transition:background .2s}
.btn-refresh:hover{background:#047857}
/* 筛选栏 */
.quiz-filter{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem}
.filter-btn{padding:0.4rem 1rem;border-radius:20px;border:1px solid #d1d5db;background:#fff;font-size:0.82rem;cursor:pointer;transition:all .2s;font-weight:500}
.filter-btn:hover,.filter-btn.active{background:var(--c-green);color:#fff;border-color:var(--c-green)}
/* 完成提示 */
.finish-banner{display:none;background:linear-gradient(135deg,#059669,#047857);color:#fff;border-radius:12px;padding:1.5rem;text-align:center;margin:1.5rem 0}
.finish-banner.show{display:block}
.finish-score-big{font-size:2.5rem;font-weight:900;margin:0.3rem 0}
.finish-msg{font-size:0.9rem;opacity:.9;margin-top:0.3rem}
.finish-actions{margin-top:1rem;display:flex;justify-content:center;gap:0.8rem;flex-wrap:wrap}
.finish-btn{padding:0.5rem 1.4rem;background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:all .2s;text-decoration:none;display:inline-block}
.finish-btn:hover{background:rgba(255,255,255,.4)}
</style>
</head>
<body>

<div class="page-hero">
    <span class="hero-tag">✏️ 越练越熟</span>
    <h1>每日一题</h1>
    <p class="subtitle">每次随机抽取 10 道题，做完查看解析，换一批再练</p>
</div>

<div class="breadcrumb">
    <a href="index.html">身体说明书</a> <span>›</span> <span>每日一题</span>
</div>

<div class="main-content">

    <div class="tip-box tip-green">
        <strong>🎯 做题建议</strong>：先自己选出答案，再点击验证。看完解析后用自己的话复述一遍——能说出来才算真的会了。
    </div>

    <div class="quiz-filter">
        <button class="filter-btn active" data-filter="all"   onclick="setFilter('all',this)">全部</button>
        <button class="filter-btn" data-filter="anatomy"      onclick="setFilter('anatomy',this)">🦴 解剖学</button>
        <button class="filter-btn" data-filter="physiology"   onclick="setFilter('physiology',this)">⚡ 生理学</button>
        <button class="filter-btn" data-filter="pathology"    onclick="setFilter('pathology',this)">🔬 病理学</button>
        <button class="filter-btn" data-filter="pharmacology" onclick="setFilter('pharmacology',this)">💊 药理学</button>
    </div>

    <div class="quiz-status">
        <div>
            <div class="status-score" id="scoreDisplay">0 / 10</div>
            <div class="status-info" id="statusInfo">已答对 / 本次 10 题</div>
        </div>
        <button class="btn-refresh" onclick="drawNew()">🔀 换一批</button>
    </div>

    <div class="finish-banner" id="finishBanner">
        <div>🎉 本次答题完成！</div>
        <div class="finish-score-big" id="finishScore">10 / 10</div>
        <div class="finish-msg" id="finishMsg"></div>
        <div class="finish-actions">
            <button class="finish-btn" onclick="drawNew()">🔀 再来一批</button>
            <a href="../index.html" class="finish-btn">📚 去看课程</a>
        </div>
    </div>

    <div id="quizContainer"></div>

    <div class="cta-section">
        <h3>📚 想深入理解每道题背后的原理？</h3>
        <p>题目对应的完整知识点都在四门课程中</p>
        <a href="../index.html" class="cta-btn">查看全部课程 →</a>
    </div>

</div>

<footer class="site-footer"></footer>

<script>
/* ===== 题库（共60题）===== */
var BANK = [
/* ---- 解剖学 15题 ---- */
{s:'anatomy',sn:'解剖学',
 q:'椎间盘突出最常见的部位是？',
 o:['C3~C4','T11~T12','L4~L5','S1~S2'],a:2,
 e:'腰椎间盘突出最常发生在 <strong>L4~L5</strong> 和 L5~S1，腰椎承重最大、活动度最高，突出的椎间盘常压迫坐骨神经。',
 l:'../解剖学网页/chapter3.html'},
{s:'anatomy',sn:'解剖学',
 q:'McBurney 点（麦氏点）是哪个器官的体表投影？',
 o:['胆囊','阑尾','胰腺','脾脏'],a:1,
 e:'McBurney 点位于脐与<strong>右髂前上棘</strong>连线中外 1/3 交点，是<strong>阑尾</strong>根部的体表投影。急性阑尾炎时该点压痛（麦氏征阳性）。',
 l:'../解剖学网页/chapter7.html'},
{s:'anatomy',sn:'解剖学',
 q:'桡神经损伤后最典型的表现是？',
 o:['猿手','爪形手','垂腕','垂足'],a:2,
 e:'桡神经支配前臂伸肌群，损伤后不能伸腕伸指，出现<strong>垂腕</strong>。猿手=正中神经，爪形手=尺神经，垂足=腓总神经。',
 l:'../解剖学网页/chapter13.html'},
{s:'anatomy',sn:'解剖学',
 q:'分布最广的脑神经是哪一对？',
 o:['三叉神经（Ⅴ）','面神经（Ⅶ）','迷走神经（Ⅹ）','舌下神经（Ⅻ）'],a:2,
 e:'<strong>迷走神经（Ⅹ）</strong>是分布最广的脑神经，支配颈部→胸腔→腹腔的心、肺、胃、肠等脏器，占全身副交感纤维约 75%。',
 l:'../解剖学网页/chapter12.html'},
{s:'anatomy',sn:'解剖学',
 q:'全身最灵活但最容易脱位的关节是？',
 o:['髋关节','膝关节','肩关节','踝关节'],a:2,
 e:'<strong>肩关节</strong>关节窝浅（仅为肱骨头的 1/3~1/4），关节囊松弛，活动范围最大但稳定性差，最易脱位（多向前下方）。',
 l:'../解剖学网页/chapter4.html'},
{s:'anatomy',sn:'解剖学',
 q:'正常成人颈椎共有几块？',
 o:['5块','6块','7块','8块'],a:2,
 e:'颈椎共 <strong>7</strong> 块，胸椎 12 块，腰椎 5 块。记忆法：早餐 7 点，中餐 12 点，晚餐 5 点。',
 l:'../解剖学网页/chapter3.html'},
{s:'anatomy',sn:'解剖学',
 q:'门静脉高压时，以下哪个部位最容易发生静脉曲张？',
 o:['颈静脉','食管下段','股静脉','颅内静脉窦'],a:1,
 e:'门静脉高压时，门-腔侧支循环开放，最典型是<strong>食管下段及胃底静脉曲张</strong>，破裂出血是最危险的并发症。脐周静脉曲张（"海蛇头"）也是常见体征。',
 l:'../解剖学网页/chapter7.html'},
{s:'anatomy',sn:'解剖学',
 q:'内囊出血的典型表现是？',
 o:['同侧偏瘫','对侧偏瘫+偏身感觉障碍+同向偏盲（三偏）','双侧偏瘫','四肢瘫痪'],a:1,
 e:'内囊是大脑皮层下行纤维必经之路，出血后对侧皮层功能全受损，典型为<strong>"三偏综合征"</strong>：对侧偏瘫、偏身感觉障碍、同向偏盲。',
 l:'../解剖学网页/chapter12.html'},
{s:'anatomy',sn:'解剖学',
 q:'尺神经损伤后的典型表现是？',
 o:['垂腕','猿手','爪形手','垂足'],a:2,
 e:'尺神经损伤导致第 4、5 指不能伸直，呈<strong>爪形手</strong>（环小指屈曲，掌指关节过伸）。还伴有手内在肌萎缩和第 4~5 指感觉丧失。',
 l:'../解剖学网页/chapter13.html'},
{s:'anatomy',sn:'解剖学',
 q:'主动脉弓从右向左发出的第一个分支是？',
 o:['左颈总动脉','右锁骨下动脉','头臂干（无名动脉）','左锁骨下动脉'],a:2,
 e:'主动脉弓从右向左依次发出：<strong>头臂干（无名动脉）→左颈总动脉→左锁骨下动脉</strong>。头臂干再分为右颈总动脉和右锁骨下动脉。',
 l:'../解剖学网页/chapter6.html'},
{s:'anatomy',sn:'解剖学',
 q:'肝脏双重血供中，门静脉和肝动脉的供血比例大约是？',
 o:['各占50%','肝动脉75%，门静脉25%','门静脉75%，肝动脉25%','肝动脉90%，门静脉10%'],a:2,
 e:'肝脏有双重血供：<strong>门静脉约 75%</strong>（来自消化道，富含营养），<strong>肝动脉约 25%</strong>（含氧丰富）。两者共同保证肝脏功能。',
 l:'../解剖学网页/chapter7.html'},
{s:'anatomy',sn:'解剖学',
 q:'膝关节内、外侧半月板的形状分别是？',
 o:['内侧O形，外侧C形','内侧C形，外侧O形','两者均为C形','两者均为O形'],a:1,
 e:'内侧半月板呈 <strong>C形</strong>（较大），外侧半月板呈 <strong>O形</strong>（近圆形）。内侧半月板与内侧副韧带相连，活动度小，损伤更常见。',
 l:'../解剖学网页/chapter5.html'},
{s:'anatomy',sn:'解剖学',
 q:'成人脊髓末端（脊髓圆锥）通常止于哪个平面？',
 o:['T12','L1~L2','L3~L4','S1'],a:1,
 e:'成人脊髓末端止于 <strong>L1~L2</strong> 之间。因此腰椎穿刺通常选择 L3~L4 或 L4~L5 间隙，以避免损伤脊髓。',
 l:'../解剖学网页/chapter11.html'},
{s:'anatomy',sn:'解剖学',
 q:'胆总管和胰管共同开口于十二指肠的哪个部分？',
 o:['上部（球部）','降部','水平部','升部'],a:1,
 e:'胆总管和胰管在十二指肠<strong>降部</strong>的大乳头处汇合开口（Oddi括约肌所在位置）。',
 l:'../解剖学网页/chapter7.html'},
{s:'anatomy',sn:'解剖学',
 q:'正中神经损伤后的典型表现是？',
 o:['垂腕','爪形手','猿手','垂足'],a:2,
 e:'正中神经损伤后，大鱼际肌萎缩，拇指不能外展和对掌，手变得扁平，形似<strong>猿手</strong>。同时伴有桡侧三指半感觉丧失。',
 l:'../解剖学网页/chapter13.html'},

/* ---- 生理学 15题 ---- */
{s:'physiology',sn:'生理学',
 q:'静息电位主要是由哪种离子的外流形成的？',
 o:['Na⁺','K⁺','Ca²⁺','Cl⁻'],a:1,
 e:'静息状态下，细胞膜对 <strong>K⁺</strong> 通透性最高，K⁺ 顺浓度梯度外流，使膜内变负、膜外变正，形成静息电位（约 -70mV）。',
 l:'../生理学网页/chapter1.html'},
{s:'physiology',sn:'生理学',
 q:'心脏的正常起搏点是？',
 o:['房室结','窦房结','房室束','浦肯野纤维'],a:1,
 e:'<strong>窦房结</strong>自律性最高（60~100次/分），是心脏正常起搏点。房室结的自律性为 40~60次/分，是次级起搏点。',
 l:'../生理学网页/chapter4.html'},
{s:'physiology',sn:'生理学',
 q:'Frank-Starling 机制（心的异长自身调节）描述的是？',
 o:['心率越快，心输出量越大','血压越高，心脏收缩越强','回心血量越多，心脏收缩力越强','交感兴奋使心脏收缩力增强'],a:2,
 e:'在一定范围内，心室充盈量（前负荷）越大，心肌纤维被拉得越长，收缩力越强，每搏输出量越多——<strong>Frank-Starling机制</strong>，是心脏无需神经参与的自身调节。',
 l:'../生理学网页/chapter4.html'},
{s:'physiology',sn:'生理学',
 q:'正常人每天肾小球滤过约180L液体，最终尿量约为？',
 o:['约10L','约5L','约1.5L','约0.5L'],a:2,
 e:'肾小球每天滤出约 180L 原尿，<strong>99% 以上被肾小管重吸收</strong>，最终排出约 1~2L 尿液。',
 l:'../生理学网页/chapter8.html'},
{s:'physiology',sn:'生理学',
 q:'以下关于交感神经的描述，错误的是？',
 o:['使心率加快','使瞳孔散大','使支气管收缩','使消化活动减弱'],a:2,
 e:'交感兴奋时支气管<strong>扩张</strong>（不是收缩），目的是增加通气量。副交感（迷走）才使支气管收缩。口诀："交感打仗，迷走吃饭"。',
 l:'../生理学网页/chapter10.html'},
{s:'physiology',sn:'生理学',
 q:'动作电位的去极化阶段主要是由哪种离子内流引起的？',
 o:['K⁺','Ca²⁺','Na⁺','Cl⁻'],a:2,
 e:'动作电位去极化时，<strong>Na⁺大量内流</strong>，使膜电位迅速从 -70mV 升至约 +30mV。动作电位具有"全或无"特性。',
 l:'../生理学网页/chapter1.html'},
{s:'physiology',sn:'生理学',
 q:'血压的计算公式是？',
 o:['心率×每搏量','心输出量×外周阻力','血容量×血管弹性','心肌收缩力×心率'],a:1,
 e:'<strong>血压 = 心输出量 × 外周阻力</strong>。高血压本质上是心输出量增多或外周阻力升高。这也解释了为什么降压药分别针对这两个靶点。',
 l:'../生理学网页/chapter5.html'},
{s:'physiology',sn:'生理学',
 q:'肺泡表面活性物质由哪种细胞分泌？',
 o:['Ⅰ型肺泡细胞','Ⅱ型肺泡细胞','肺泡巨噬细胞','毛细血管内皮细胞'],a:1,
 e:'<strong>Ⅱ型肺泡细胞</strong>分泌肺泡表面活性物质（主要成分磷脂酰胆碱），降低肺泡表面张力，防止肺泡塌陷。早产儿缺乏→新生儿呼吸窘迫综合征。',
 l:'../生理学网页/chapter6.html'},
{s:'physiology',sn:'生理学',
 q:'ADH（抗利尿激素）主要作用于哪个部位？',
 o:['近曲小管','远曲小管和集合管','髓袢升支','肾小球'],a:1,
 e:'ADH 作用于<strong>远曲小管和集合管</strong>，促进水的重吸收，使尿液浓缩、尿量减少。ADH缺乏→中枢性尿崩症（每天尿量可达10L以上）。',
 l:'../生理学网页/chapter8.html'},
{s:'physiology',sn:'生理学',
 q:'RAAS 系统中，使血管收缩升压的关键效应物质是？',
 o:['肾素','血管紧张素Ⅰ','血管紧张素Ⅱ','醛固酮'],a:2,
 e:'<strong>血管紧张素Ⅱ（AngⅡ）</strong>是 RAAS 中最核心的效应物质：强烈收缩血管+刺激醛固酮分泌（保钠保水）→升高血压。ACEI 和 ARB 均针对此靶点。',
 l:'../生理学网页/chapter4.html'},
{s:'physiology',sn:'生理学',
 q:'红细胞的正常寿命约为？',
 o:['约30天','约60天','约120天','约180天'],a:2,
 e:'红细胞寿命约 <strong>120 天</strong>，这是 HbA1c 能反映过去 2~3 个月平均血糖水平的原因。HbA1c 是糖尿病长期管理的重要指标（目标 <7%）。',
 l:'../生理学网页/chapter3.html'},
{s:'physiology',sn:'生理学',
 q:'胰岛素促进葡萄糖摄取的主要靶组织是？',
 o:['肝脏和肾脏','骨骼肌和脂肪组织','大脑和心肌','小肠上皮'],a:1,
 e:'胰岛素主要作用于<strong>骨骼肌和脂肪组织</strong>（通过 GLUT4 转运），促进葡萄糖摄取和糖原合成。大脑摄取葡萄糖不依赖胰岛素（GLUT1/3），所以低血糖时大脑先受损。',
 l:'../生理学网页/chapter11.html'},
{s:'physiology',sn:'生理学',
 q:'吸气的最重要动力肌是？',
 o:['肋间外肌','膈肌','胸锁乳突肌','腹肌'],a:1,
 e:'<strong>膈肌</strong>是最重要的吸气肌，承担约 60~70% 的呼吸功。膈肌收缩→膈下降→胸腔容积增大→肺被动扩张吸气。肋间外肌是辅助吸气肌。',
 l:'../生理学网页/chapter6.html'},
{s:'physiology',sn:'生理学',
 q:'醛固酮的主要生理作用是？',
 o:['促进肾脏排钠保钾','促进肾脏保钠排钾','抑制肾脏对水的重吸收','升高血钾'],a:1,

/* ===== 核心逻辑 ===== */
var DRAW_COUNT = 10;
var currentSet   = [];  // 本次抽到的题（题库对象）
var answered     = {};  // { 本次位置pos : 选择的选项oi }
var correctCount = 0;
var currentFilter = 'all';

function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}

function drawNew() {
    var pool = BANK.filter(function(q) {
        return currentFilter === 'all' || q.s === currentFilter;
    });
    var count = Math.min(DRAW_COUNT, pool.length);
    currentSet   = shuffle(pool).slice(0, count);
    answered     = {};
    correctCount = 0;
    document.getElementById('finishBanner').classList.remove('show');
    updateScore();
    renderQuiz();
    window.scrollTo({ top: document.querySelector('.quiz-status').offsetTop - 80, behavior: 'smooth' });
}

function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    drawNew();
}

function selectOption(pos, oi) {
    if (answered[pos] !== undefined) return;
    answered[pos] = oi;
    if (oi === currentSet[pos].a) correctCount++;
    updateScore();
    renderQuiz();
    checkFinish();
}

function updateScore() {
    var total = currentSet.length;
    document.getElementById('scoreDisplay').textContent = correctCount + ' / ' + total;
    document.getElementById('statusInfo').textContent =
        '已答对 / 本次 ' + total + ' 题  ·  题库共 ' + BANK.length + ' 题';
}

function checkFinish() {
    if (Object.keys(answered).length < currentSet.length) return;
    var banner = document.getElementById('finishBanner');
    banner.classList.add('show');
    document.getElementById('finishScore').textContent = correctCount + ' / ' + currentSet.length;
    var rate = correctCount / currentSet.length;
    var msg = rate === 1 ? '🏆 全部答对！继续保持！'
            : rate >= .8 ? '👍 非常不错，再接再厉！'
            : rate >= .6 ? '💪 还需加强，建议查看解析再练一遍。'
            : '📖 建议回到课程复习相关章节，再来挑战！';
    document.getElementById('finishMsg').textContent = msg;
    banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    var labels = ['A', 'B', 'C', 'D'];
    currentSet.forEach(function(q, pos) {
        var optHTML = '';
        q.o.forEach(function(opt, j) {
            var cls = '';
            if (answered[pos] !== undefined) {
                if (j === q.a)                              cls = ' correct';
                else if (j === answered[pos] && j !== q.a) cls = ' wrong';
            }
            optHTML += '<li class="' + cls + '" onclick="selectOption(' + pos + ',' + j + ')">' +
                       labels[j] + '. ' + opt + '</li>';
        });
        var ansShow = answered[pos] !== undefined ? ' show' : '';
        var card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML =
            '<div class="quiz-header">' +
                '<div class="quiz-num">' + (pos + 1) + '</div>' +
                '<span class="quiz-subj qs-' + q.s + '">' + q.sn + '</span>' +
            '</div>' +
            '<div class="quiz-body">' +
                '<div class="quiz-question">' + q.q + '</div>' +
                '<ul class="quiz-options">' + optHTML + '</ul>' +
            '</div>' +
            '<div class="quiz-answer' + ansShow + '">' +
                '<div class="answer-label">✅ 正确答案：' + labels[q.a] + '</div>' +
                '<div class="answer-explain">' + q.e + '</div>' +
                (q.l ? '<div class="extend-links" style="margin-top:0.6rem"><a href="' + q.l +
                    '" class="extend-link el-' + q.s + '">📖 查看完整知识点 →</a></div>' : '') +
            '</div>';
        container.appendChild(card);
    });
}

// 页面加载立即抽题
drawNew();
