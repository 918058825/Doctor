<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的账号 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #1a2740;
  --border: #2d3f55; --text: #f1f5f9; --muted: #94a3b8;
  --green: #059669; --accent: #0284c7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 0 0 3rem;
}
a { color: inherit; text-decoration: none; }

/* 顶部导航栏 */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.5rem;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 99;
}
.topbar-brand { font-size: .95rem; font-weight: 800; }
.topbar-back {
  font-size: .8rem; color: var(--muted);
  padding: .32rem .8rem; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  transition: color .15s;
}
.topbar-back:hover { color: var(--text); }

/* 主体布局 */
.panel {
  max-width: 560px; margin: 2rem auto; padding: 0 1.2rem;
  display: flex; flex-direction: column; gap: 1rem;
}

/* 用户头像区 */
.profile-header {
  background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 1.8rem 1.5rem 1.5rem;
  display: flex; align-items: center; gap: 1.2rem;
}
.avatar-circle {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #0ea5e9);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(2,132,199,.25);
}
.profile-info { flex: 1; min-width: 0; }
.profile-email {
  font-size: .95rem; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-bottom: .3rem;
}
.profile-since { font-size: .76rem; color: var(--muted); }

/* 卡片通用 */
.section-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden;
}
.section-title {
  font-size: .72rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  padding: .9rem 1.2rem .5rem;
}
.row {
  display: flex; align-items: center; gap: .9rem;
  padding: .85rem 1.2rem;
  border-top: 1px solid var(--border);
}
.row:first-of-type { border-top: none; }
.row-icon { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
.row-body { flex: 1; min-width: 0; }
.row-label { font-size: .73rem; color: var(--muted); margin-bottom: .12rem; }
.row-value { font-size: .9rem; font-weight: 600; }

/* VIP 徽章 */
.badge-vip {
  display: inline-flex; align-items: center; gap: .28rem;
  background: linear-gradient(90deg, rgba(217,119,6,.18), rgba(251,191,36,.12));
  border: 1px solid rgba(251,191,36,.35); color: #fbbf24;
  padding: .3rem .9rem; border-radius: 999px;
  font-size: .8rem; font-weight: 700;
}
.badge-free {
  display: inline-flex; align-items: center; gap: .28rem;
  background: rgba(148,163,184,.08); border: 1px solid rgba(148,163,184,.2);
  color: var(--muted); padding: .3rem .9rem; border-radius: 999px;
  font-size: .8rem; font-weight: 600;
}

/* 已解锁 tag */
.tag-list { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
.unlock-tag {
  background: rgba(5,150,105,.15); border: 1px solid rgba(5,150,105,.3);
  color: #6ee7b7; padding: .22rem .7rem; border-radius: 6px;
  font-size: .76rem; font-weight: 600;
}

/* 操作按钮区 */
.action-row {
  display: flex; align-items: center; gap: .9rem;
  padding: .85rem 1.2rem;
  border-top: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
  text-decoration: none; color: var(--text);
}
.action-row:hover { background: rgba(255,255,255,.03); }
.action-row:first-of-type { border-top: none; }
.action-icon { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; }
.action-label { flex: 1; font-size: .88rem; font-weight: 600; }
.action-arrow { color: #475569; font-size: .85rem; }
.action-danger .action-label { color: #fca5a5; }

/* loading */
.loading-mask { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">👤 我的账号</span>
  <a class="topbar-back" href="index.html">← 首页</a>
</div>

<div id="loading-mask" class="loading-mask">加载中…</div>

<div id="panel" class="panel" style="display:none">

  <!-- 用户头像区 -->
  <div class="profile-header">
    <div class="avatar-circle">👤</div>
    <div class="profile-info">
      <div class="profile-email" id="disp-email">—</div>
      <div class="profile-since" id="disp-since">—</div>
    </div>
  </div>

  <!-- 会员状态 -->
  <div class="section-card">
    <div class="section-title">会员状态</div>
    <div class="row">
      <div class="row-icon">⭐</div>
      <div class="row-body">
        <div class="row-label">账号等级</div>
        <div class="row-value" id="disp-vip">—</div>
      </div>
    </div>
    <div class="row" id="row-unlocked" style="display:none">
      <div class="row-icon">🔓</div>
      <div class="row-body">
        <div class="row-label">已解锁内容</div>
        <div class="tag-list" id="disp-unlocked"></div>
      </div>
    </div>
    <div class="row">
      <div class="row-icon">📅</div>
      <div class="row-body">
        <div class="row-label">有效期</div>
        <div class="row-value" id="disp-expire" style="color:var(--muted)">—</div>
      </div>
    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="section-card">
    <div class="section-title">操作</div>
    <a class="action-row" href="redeem.html">
      <span class="action-icon">🎟️</span>
      <span class="action-label">输入兑换码解锁课程</span>
      <span class="action-arrow">›</span>
    </a>
    <a class="action-row" href="index.html">
      <span class="action-icon">📚</span>
      <span class="action-label">去学习</span>
      <span class="action-arrow">›</span>
    </a>
    <div class="action-row action-danger" onclick="doLogout()">
      <span class="action-icon">🚪</span>
      <span class="action-label">退出登录</span>
      <span class="action-arrow">›</span>
    </div>
  </div>

  <div style="text-align:center;font-size:.76rem;color:#475569;padding:.5rem 0">
    问题反馈：公众号「求学少年」或 bitw@foxmail.com
  </div>

</div>

<script src="auth.js"></script>
<script>
if (!XWAuth.isLoggedIn()) {
  location.replace('login.html?next=' + encodeURIComponent(location.href));
}

(async function () {
  var sess = XWAuth.getSess();
  var profile = await XWAuth.getProfile();

  document.getElementById('loading-mask').style.display = 'none';
  document.getElementById('panel').style.display = 'flex';

  var email = (sess && sess.user) ? sess.user.email : '未知';
  document.getElementById('disp-email').textContent = email;

  var createdAt = sess && sess.user && sess.user.created_at;
  if (createdAt) {
    var d = new Date(createdAt);
    document.getElementById('disp-since').textContent =
      '注册于 ' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  if (!profile) {
    document.getElementById('disp-vip').innerHTML = '<span class="badge-free">获取失败，请刷新</span>';
    return;
  }

  if (profile.is_vip) {
    document.getElementById('disp-vip').innerHTML = '<span class="badge-vip">✨ 付费会员</span>';
    document.getElementById('disp-expire').textContent = '长期有效';
    document.getElementById('disp-expire').style.color = '#6ee7b7';

    var unlocked = profile.unlocked || [];
    if (unlocked.length > 0) {
      document.getElementById('row-unlocked').style.display = 'flex';
      var listEl = document.getElementById('disp-unlocked');
      unlocked.forEach(function (k) {
        var tag = document.createElement('span');
        tag.className = 'unlock-tag';
        tag.textContent = XWAuth.COURSE_NAMES[k] || k;
        listEl.appendChild(tag);
      });
    }
  } else {
    document.getElementById('disp-vip').innerHTML = '<span class="badge-free">免费用户</span>';
    document.getElementById('disp-expire').textContent = '购买后长期有效';
  }
})();

function doLogout() {
  if (confirm('确认退出登录？')) XWAuth.signOut();
}
</script>
</body>
</html>
