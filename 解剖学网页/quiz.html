        .quiz-header { text-align:center; margin-bottom:24px; }

        .quiz-progress-bar { height:100%; background:linear-gradient(90deg, var(--primary), #a855f7); border-radius:20px; transition:width 0.4s ease; }
        .quiz-stats { display:flex; gap:16px; justify-content:center; margin-bottom:20px; }
        .quiz-stat { padding:8px 20px; border-radius:10px; font-size:0.9rem; font-weight:600; }
        .quiz-stat.correct { background:#dcfce7; color:#16a34a; }
        .quiz-stat.wrong { background:#fef2f2; color:#dc2626; }
        .quiz-stat.remaining { background:#eff6ff; color:#2563eb; }
        .quiz-card { background:#fff; border:2px solid var(--gray-200); border-radius:16px; padding:28px; margin-bottom:20px; transition:border-color 0.3s; }
        .quiz-card.answered-correct { border-color:#16a34a; }
        .quiz-card.answered-wrong { border-color:#dc2626; }
        .quiz-q { font-size:1.1rem; font-weight:600; margin-bottom:4px; color:var(--gray-900); }
        .quiz-chapter { font-size:0.8rem; color:var(--gray-400); margin-bottom:16px; }
        .quiz-options { display:flex; flex-direction:column; gap:10px; }
        .quiz-option { display:flex; align-items:center; padding:12px 16px; border:2px solid var(--gray-200); border-radius:10px; cursor:pointer; transition:all 0.2s; font-size:0.95rem; }
        .quiz-option:hover:not(.disabled) { border-color:var(--primary); background:rgba(99,102,241,0.05); }
        .quiz-option.selected { border-color:var(--primary); background:rgba(99,102,241,0.1); }
        .quiz-option.correct-answer { border-color:#16a34a; background:#dcfce7; }
        .quiz-option.wrong-answer { border-color:#dc2626; background:#fef2f2; }
        .quiz-option.disabled { cursor:default; opacity:0.85; }
        .quiz-option .opt-label { width:28px; height:28px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:var(--gray-600); margin-right:12px; flex-shrink:0; }
        .quiz-explanation { margin-top:12px; padding:12px 16px; border-radius:10px; font-size:0.9rem; line-height:1.6; display:none; }
        .quiz-explanation.show { display:block; }
        .quiz-explanation.correct { background:#f0fdf4; border-left:4px solid #16a34a; }
        .quiz-explanation.wrong { background:#fef2f2; border-left:4px solid #dc2626; }
        .quiz-actions { display:flex; gap:12px; justify-content:center; margin-top:24px; }
        .quiz-btn { padding:12px 28px; border-radius:10px; border:none; font-size:1rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .quiz-btn.primary { background:var(--primary); color:#fff; }
        .quiz-btn.primary:hover { background:var(--primary-dark); }
        .quiz-btn.outline { background:#fff; color:var(--primary); border:2px solid var(--primary); }
        .quiz-btn.outline:hover { background:rgba(99,102,241,0.05); }
        .quiz-result { text-align:center; padding:40px; display:none; }
        .quiz-result .score { font-size:3rem; font-weight:800; color:var(--primary); }
        .quiz-result .score-text { font-size:1.2rem; color:var(--gray-600); margin-top:8px; }
        .quiz-filter { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
        .quiz-filter button { padding:6px 16px; border:1.5px solid var(--gray-300); border-radius:20px; background:#fff; cursor:pointer; font-size:0.85rem; transition:all 0.2s; }
        .quiz-filter button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

<script>
const allQuestions = [
    // 基础概念
    {q:"解剖学的标准姿势中，手掌应该朝向哪个方向？", opts:["朝后","朝内（贴大腿）","朝前","朝下"], ans:2, ch:"第4章", exp:"标准姿势要求手掌朝前！这是最容易忽略的一点，会影响前臂桡侧/尺侧的判断。", cat:"基础"},
    {q:"人体四大基本组织不包括以下哪个？", opts:["上皮组织","骨组织","肌肉组织","神经组织"], ans:1, ch:"第3章", exp:"四大基本组织是：上皮组织、结缔组织、肌肉组织、神经组织。骨组织属于结缔组织的一种。", cat:"基础"},
    {q:"血液属于哪种基本组织？", opts:["上皮组织","结缔组织","肌肉组织","不属于四大组织"], ans:1, ch:"第3章", exp:"血液是液态的结缔组织！血浆是细胞外基质（液态），血细胞是其中的细胞成分。", cat:"基础"},
    {q:"CT扫描利用的是哪种影像原理？", opts:["超声波","X射线","磁场和射频波","红外线"], ans:1, ch:"第2章", exp:"CT使用X射线，擅长看骨头、肺部、出血。MRI用的才是磁场和射频波。", cat:"基础"},
    {q:"将人体分成左右两半的切面叫什么？", opts:["冠状面","水平面","矢状面","斜切面"], ans:2, ch:"第4章", exp:"矢状面=前后方向纵切，把人分左右；冠状面=分前后；水平面=分上下。", cat:"基础"},
    {q:"人体细胞总数约为多少？", opts:["37亿","37万亿","370亿","3.7万亿"], ans:1, ch:"第3章", exp:"人体约有37万亿（37 trillion）个细胞，其中200多种不同类型。", cat:"基础"},
    {q:"胚胎学中，神经系统和皮肤来源于哪个胚层？", opts:["内胚层","中胚层","外胚层","以上都有"], ans:2, ch:"第2章", exp:"外胚层发育成皮肤、神经系统和感觉器官。中胚层→骨骼肌肉心血管，内胚层→消化管呼吸道内衬。", cat:"基础"},

    // 人体系统
    {q:"成人全身共有多少块骨头？", opts:["186块","206块","226块","256块"], ans:1, ch:"第5章", exp:"成人206块骨头。儿童约270块，部分在成长过程中融合（如骶椎融合成骶骨）。", cat:"系统"},
    {q:"全身最大的肌肉是？", opts:["股四头肌","背阔肌","臀大肌","胸大肌"], ans:2, ch:"第5章", exp:"臀大肌是人体最大的肌肉，站立、上楼梯、跑步时主要发力。", cat:"系统"},
    {q:"小肠的吸收面积约为多少？", opts:["20平方米","200平方米","2000平方米","2平方米"], ans:1, ch:"第6章", exp:"通过环形皱襞(×3)→绒毛(×10)→微绒毛(×20)三级放大，小肠面积从0.3㎡扩大到约200㎡≈一个网球场。", cat:"系统"},
    {q:"食管有几个狭窄处？", opts:["2个","3个","4个","5个"], ans:1, ch:"第6章", exp:"食管三个狭窄：起始处（距门齿15cm）、与左支气管交叉处（25cm）、穿膈肌处（40cm）。是异物易卡和癌症好发部位。", cat:"系统"},
    {q:"胃酸的pH值约为多少？", opts:["3.5-4","1.5-2","5-6","0.5-1"], ans:1, ch:"第6章", exp:"胃酸pH约1.5-2，酸度极强，能杀灭大部分随食物进入的细菌。胃靠黏液-碳酸氢盐屏障保护自己。", cat:"系统"},
    {q:"肺泡的数量约为多少？", opts:["7千万","7亿","7千","70亿"], ans:1, ch:"第7章", exp:"双肺约有7亿个肺泡，总表面积约100㎡，为高效气体交换提供了巨大的接触面积。", cat:"系统"},
    {q:"心脏的四个腔中，壁最厚的是？", opts:["右心房","右心室","左心房","左心室"], ans:3, ch:"第8章", exp:"左心室要把血泵到全身（体循环），克服最大阻力，所以壁最厚（约1cm），是右心室壁厚的3倍。", cat:"系统"},
    {q:"以下哪种血管里流的是缺氧血？", opts:["主动脉","肺静脉","肺动脉","桡动脉"], ans:2, ch:"第8章", exp:"肺动脉从右心室出发，把缺氧血送到肺进行气体交换。动脉≠含氧血！动脉的定义是'从心脏出去的血管'。", cat:"系统"},
    {q:"每个肾约有多少个肾单位？", opts:["1万","10万","100万","1000万"], ans:2, ch:"第9章", exp:"每个肾约100万个肾单位（nephron），是肾脏的基本功能单位，完成滤过、重吸收和分泌。", cat:"系统"},
    {q:"受精通常发生在女性生殖道的哪个部位？", opts:["子宫腔","阴道","输卵管壶腹部","卵巢表面"], ans:2, ch:"第10章", exp:"受精通常发生在输卵管壶腹部。受精卵需要约6-7天才能移动到子宫并着床。", cat:"系统"},

    // 调控与感觉
    {q:"人脑约有多少个神经元？", opts:["86亿","860亿","8600亿","86万亿"], ans:1, ch:"第11章", exp:"大脑约有860亿个神经元，虽然只占体重2%，却消耗全身20%的氧气和25%的葡萄糖。", cat:"调控"},
    {q:"脑干中的哪个结构被称为'生命中枢'？", opts:["中脑","脑桥","延髓","丘脑"], ans:2, ch:"第11章", exp:"延髓含呼吸中枢和心血管中枢，控制最基本的生命功能。延髓损伤=立即死亡。", cat:"调控"},
    {q:"'战斗或逃跑'反应主要由哪个神经系统控制？", opts:["躯体神经","副交感神经","交感神经","中枢神经"], ans:2, ch:"第11章", exp:"交感神经='战斗逃跑'（心率↑、血压↑、瞳孔散大）；副交感神经='休息消化'。", cat:"调控"},
    {q:"人体中唯一能降低血糖的激素是？", opts:["胰高血糖素","皮质醇","胰岛素","肾上腺素"], ans:2, ch:"第12章", exp:"胰岛素是唯一能降低血糖的激素。升高血糖的激素有好多个（胰高血糖素、皮质醇、肾上腺素、生长激素等），但降糖的只有胰岛素。", cat:"调控"},
    {q:"内分泌系统最核心的调节机制是？", opts:["正反馈","负反馈","前馈调节","开环控制"], ans:1, ch:"第12章", exp:"负反馈=激素水平升高→抑制上级分泌→激素减少。就像空调恒温器，维持激素在正常范围。", cat:"调控"},
    {q:"五种感觉中，唯一不经过丘脑中转的是？", opts:["视觉","听觉","嗅觉","触觉"], ans:2, ch:"第13章", exp:"嗅觉是唯一直达大脑皮层、不经过丘脑'中转站'的感觉，因此与记忆和情绪的关联最强。", cat:"调控"},
    {q:"视网膜上负责彩色视觉的是？", opts:["视杆细胞","视锥细胞","双极细胞","神经节细胞"], ans:1, ch:"第13章", exp:"视锥细胞（约600万个）负责明视觉和色觉；视杆细胞（约1.2亿）负责暗光下的黑白视觉。", cat:"调控"},
    {q:"甲亢（甲状腺功能亢进）患者通常表现为？", opts:["怕冷、嗜睡、体重增加","怕热、消瘦、心跳加速","血压低、食欲差","无明显症状"], ans:1, ch:"第12章", exp:"甲亢=代谢过快→消瘦、心跳加速、怕热多汗、烦躁易怒。甲减则完全相反。", cat:"调控"},
];

let currentQuestions = [];
let currentIdx = 0;
let correctTotal = 0;
let wrongTotal = 0;
let quizMode = '全部';

function selectQuizMode(mode) {
    quizMode = mode;
    document.querySelectorAll('.quiz-filter button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}

function shuffle(arr) {
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
}

function startQuiz() {
    let pool = allQuestions;
    if(quizMode!=='全部') pool = allQuestions.filter(q=>q.cat===quizMode);
    currentQuestions = shuffle([...pool]).slice(0, Math.min(10, pool.length));
    currentIdx = 0; correctTotal = 0; wrongTotal = 0;
    document.getElementById('quizResult').style.display = 'none';
    document.getElementById('quizActions').innerHTML = '';
    updateStats();
    renderQuestion();
}

function updateStats() {
    const total = currentQuestions.length;
    const done = correctTotal + wrongTotal;
    document.getElementById('progressBar').style.width = (done/total*100)+'%';
    document.getElementById('correctCount').textContent = '✅ ' + correctTotal;
    document.getElementById('wrongCount').textContent = '❌ ' + wrongTotal;
    document.getElementById('remainCount').textContent = '📝 剩余 ' + (total - done);
}

function renderQuestion() {
    if(currentIdx >= currentQuestions.length){ showResult(); return; }
    const q = currentQuestions[currentIdx];
    let html = `<div class="quiz-card" id="qcard">
        <div class="quiz-q">${currentIdx+1}/${currentQuestions.length}. ${q.q}</div>
        <div class="quiz-chapter">📖 来源：${q.ch}</div>
        <div class="quiz-options">`;
    const labels = ['A','B','C','D'];
    q.opts.forEach((opt,i) => {
        html += `<div class="quiz-option" id="opt${i}" onclick="selectAnswer(${i})">
            <span class="opt-label">${labels[i]}</span><span>${opt}</span></div>`;
    });
    html += `</div><div class="quiz-explanation" id="qexp"></div></div>`;
    document.getElementById('quizContainer').innerHTML = html;
}

function selectAnswer(idx) {
    const q = currentQuestions[currentIdx];
    const opts = document.querySelectorAll('.quiz-option');
    opts.forEach(o => o.classList.add('disabled'));
    const expDiv = document.getElementById('qexp');

    if(idx === q.ans) {
        correctTotal++;
        opts[idx].classList.add('correct-answer');
        document.getElementById('qcard').classList.add('answered-correct');
        expDiv.className = 'quiz-explanation show correct';
        expDiv.innerHTML = '✅ <strong>回答正确！</strong> ' + q.exp;
    } else {
        wrongTotal++;
        opts[idx].classList.add('wrong-answer');
        opts[q.ans].classList.add('correct-answer');
        document.getElementById('qcard').classList.add('answered-wrong');
        expDiv.className = 'quiz-explanation show wrong';
        expDiv.innerHTML = '❌ <strong>回答错误。</strong> 正确答案是 <strong>' + ['A','B','C','D'][q.ans] + '</strong>。' + q.exp;
    }
    updateStats();
    setTimeout(() => { currentIdx++; renderQuestion(); }, 2200);
}

function showResult() {
    document.getElementById('quizContainer').innerHTML = '';
    const total = currentQuestions.length;
    const pct = Math.round(correctTotal/total*100);
    let msg = '';
    if(pct >= 90) msg = '🎉 太棒了！你已经掌握得非常好！';
    else if(pct >= 70) msg = '👍 不错！大部分内容都理解了，可以回顾错题对应的章节。';
    else if(pct >= 50) msg = '💪 继续加油！建议重新阅读答错的章节内容。';
    else msg = '📖 别灰心！建议从头仔细阅读一遍，然后再来挑战。';
    const resultDiv = document.getElementById('quizResult');
    resultDiv.style.display = 'block';
    document.getElementById('finalScore').textContent = correctTotal + ' / ' + total;
    document.getElementById('scoreText').innerHTML = `正确率 ${pct}%<br>${msg}`;
}
</script>
