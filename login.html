<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --accent: #0284c7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem 1rem;
}
a { color: inherit; text-decoration: none; }
.back {
  position: fixed; top: 1.2rem; left: 1.5rem;
  font-size: .83rem; color: var(--muted);
  padding: .38rem .85rem; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  transition: color .15s;
}
.back:hover { color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
}
.logo { font-size: 2.4rem; text-align: center; margin-bottom: .9rem; }
h1 { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: .3rem; }
.sub { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 2rem; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
input {
  display: block; width: 100%;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: .75rem 1rem;
  color: var(--text); font-size: .9rem; margin-bottom: 1.25rem;
  outline: none; transition: border-color .15s; font-family: inherit;
}
input:focus { border-color: var(--accent); }
input::placeholder { color: #475569; }
.btn {
  display: block; width: 100%; padding: .88rem;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s; font-family: inherit;
  background: var(--accent); color: white;
}
.btn:hover:not(:disabled) { opacity: .88; }
.btn:disabled { opacity: .5; cursor: default; }
.err-box {
  background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.3);
  color: #fca5a5; padding: .72rem 1rem; border-radius: 8px;
  font-size: .84rem; margin-bottom: 1.2rem; display: none;
}
.links {
  margin-top: 1.5rem; text-align: center;
  font-size: .84rem; color: var(--muted); line-height: 2.2;
}
.links a { color: #7dd3fc; }
.links a:hover { text-decoration: underline; }
.divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
</style>
</head>
<body>

<a class="back" href="index.html">← 返回首页</a>

<div class="card">
  <div class="logo">📚</div>
  <h1>登录账号</h1>
  <p class="sub">求学少年 · 医学基础学习平台</p>

  <div id="err-box" class="err-box"></div>

  <form id="form">
    <label for="email">邮箱</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
    <label for="password">密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    <button class="btn" id="btn" type="submit">登录</button>
  </form>

  <div class="links">
    <a href="register.html">还没有账号？免费注册 →</a><br>
    <span style="font-size:.76rem;color:#475569">登录遇到问题可联系公众号：求学少年</span>
  </div>
</div>

<script src="auth.js"></script>
<script>
// 已登录则直接跳转
if (XWAuth.isLoggedIn()) {
  var next = new URLSearchParams(location.search).get('next');
  location.replace(next || 'index.html');
}

document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn');
  var errBox = document.getElementById('err-box');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = '登录中…';
  errBox.style.display = 'none';

  try {
    await XWAuth.signIn(email, password);
    var next = new URLSearchParams(location.search).get('next');
    location.replace(next || 'index.html');
  } catch (err) {
    var msg = err.message || '登录失败';
    if (msg.includes('Invalid login')) msg = '邮箱或密码错误，请重试';
    if (msg.includes('Email not confirmed')) msg = '邮箱尚未验证，请先查收确认邮件';
    errBox.textContent = msg;
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '登录';
  }
});
</script>
</body>
</html>
