<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --accent: #0284c7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem 1rem;
}
a { color: inherit; text-decoration: none; }
.back {
  position: fixed; top: 1.2rem; left: 1.5rem;
  font-size: .83rem; color: var(--muted);
  padding: .38rem .85rem; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  transition: color .15s;
}
.back:hover { color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
}
.logo { font-size: 2.4rem; text-align: center; margin-bottom: .9rem; }
h1 { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: .3rem; }
.sub { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 2rem; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
input {
  display: block; width: 100%;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: .75rem 1rem;
  color: var(--text); font-size: .9rem; margin-bottom: 1.25rem;
  outline: none; transition: border-color .15s; font-family: inherit;
}
input:focus { border-color: var(--accent); }
input::placeholder { color: #475569; }
.btn {
  display: block; width: 100%; padding: .88rem;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s; font-family: inherit;
  background: var(--accent); color: white;
}
.btn:hover:not(:disabled) { opacity: .88; }
.btn:disabled { opacity: .5; cursor: default; }
.err-box {
  background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.3);
  color: #fca5a5; padding: .72rem 1rem; border-radius: 8px;
  font-size: .84rem; margin-bottom: 1.2rem; display: none;
}
.links {
  margin-top: 1.5rem; text-align: center;
  font-size: .84rem; color: var(--muted); line-height: 2.2;
}
.links a { color: #7dd3fc; }
.links a:hover { text-decoration: underline; }
.divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
</style>
</head>
<body>
<script src="auth.js"></script>
<script>
if (XWAuth.isLoggedIn()) {
  var next = new URLSearchParams(location.search).get('next');
  location.replace(next || 'index.html');
} else {
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof openAuthModal === 'function') openAuthModal('login');
  });
}
</script>
</body>
</html>
