<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --accent: #0284c7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem 1rem;
}
a { color: inherit; text-decoration: none; }
.back {
  position: fixed; top: 1.2rem; left: 1.5rem;
  font-size: .83rem; color: var(--muted);
  padding: .38rem .85rem; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  transition: color .15s;
}
.back:hover { color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem;
  width: 100%; max-width: 400px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
}
.logo { font-size: 2.4rem; text-align: center; margin-bottom: .9rem; }
h1 { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: .3rem; }
.sub { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 2rem; line-height: 1.6; }
label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
input {
  display: block; width: 100%;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: .75rem 1rem;
  color: var(--text); font-size: .9rem; margin-bottom: 1.25rem;
  outline: none; transition: border-color .15s; font-family: inherit;
}
input:focus { border-color: var(--accent); }
input::placeholder { color: #475569; }
.btn {
  display: block; width: 100%; padding: .88rem;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s; font-family: inherit;
  background: var(--accent); color: white;
}
.btn:hover:not(:disabled) { opacity: .88; }
.btn:disabled { opacity: .5; cursor: default; }
.err-box {
  background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.3);
  color: #fca5a5; padding: .72rem 1rem; border-radius: 8px;
  font-size: .84rem; margin-bottom: 1.2rem; display: none;
}
.ok-box {
  background: rgba(5,150,105,.12); border: 1px solid rgba(5,150,105,.3);
  color: #6ee7b7; padding: .72rem 1rem; border-radius: 8px;
  font-size: .84rem; margin-bottom: 1.2rem; display: none;
}
.links {
  margin-top: 1.5rem; text-align: center;
  font-size: .84rem; color: var(--muted);
}
.links a { color: #7dd3fc; }
.links a:hover { text-decoration: underline; }
/* 成功状态 */
.done-state { text-align: center; display: none; }
.done-state .icon { font-size: 3rem; margin-bottom: 1rem; }
.done-state h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: .5rem; }
.done-state p { color: var(--muted); font-size: .85rem; line-height: 1.7; margin-bottom: 1.8rem; }
.btn-go {
  display: block; text-align: center; padding: .88rem;
  border-radius: 10px; background: var(--accent); color: white;
  font-weight: 700; font-size: .95rem;
}
</style>
</head>
<body>

<a class="back" href="login.html">← 返回登录</a>

<div class="card">
  <div class="logo">🔑</div>

  <!-- 状态1：输邮箱发重置邮件 -->
  <div id="send-state">
    <h1>重置密码</h1>
    <p class="sub">输入你的账号邮箱<br>我们会发一封重置邮件给你</p>

    <div id="err-box1" class="err-box"></div>
    <div id="ok-box1" class="ok-box"></div>

    <form id="send-form">
      <label for="email">账号邮箱</label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
      <button class="btn" id="send-btn" type="submit">发送重置邮件</button>
    </form>

    <div class="links">
      <a href="login.html">想起密码了？直接登录</a>
    </div>
  </div>

  <!-- 状态2：点邮件链接回来后，输新密码 -->
  <div id="reset-state" style="display:none;">
    <h1>设置新密码</h1>
    <p class="sub">请输入你的新密码</p>

    <div id="err-box2" class="err-box"></div>

    <form id="reset-form">
      <label for="newpwd">新密码</label>
      <input type="password" id="newpwd" placeholder="至少6位" autocomplete="new-password" required minlength="6">
      <label for="confirmpwd">确认新密码</label>
      <input type="password" id="confirmpwd" placeholder="再输一次" autocomplete="new-password" required>
      <button class="btn" id="reset-btn" type="submit">确认修改</button>
    </form>
  </div>

  <!-- 状态3：修改成功 -->
  <div id="done-state" class="done-state">
    <div class="icon">✅</div>
    <h2>密码已更新！</h2>
    <p>新密码已设置成功<br>请用新密码登录</p>
    <a href="login.html" class="btn-go">去登录 →</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
// 检测三种进入场景
(function () {
  // 场景1：已登录用户从账号页点「修改密码」进来
  var mode = new URLSearchParams(location.search).get('mode');
  if (mode === 'change' && XWAuth.isLoggedIn()) {
    document.getElementById('send-state').style.display = 'none';
    document.getElementById('reset-state').style.display = 'block';
    document.querySelector('#reset-state h1').textContent = '修改密码';
    document.querySelector('#reset-state .sub').textContent = '输入你要设置的新密码';
    return;
  }

  // 场景2：点邮件里的重置链接回来（#access_token=...&type=recovery）
  var hash = window.location.hash;
  var params = new URLSearchParams(hash.replace('#', '?'));
  var token = params.get('access_token');
  var type  = params.get('type');
  if (token && type === 'recovery') {
    var sess = { access_token: token, refresh_token: params.get('refresh_token') || '' };
    localStorage.setItem('xw_sess_v1', JSON.stringify(sess));
    document.getElementById('send-state').style.display = 'none';
    document.getElementById('reset-state').style.display = 'block';
  }
  // 场景3：直接访问，默认显示发邮件界面（无需处理）
})();

// 发送重置邮件
document.getElementById('send-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn    = document.getElementById('send-btn');
  var errBox = document.getElementById('err-box1');
  var okBox  = document.getElementById('ok-box1');
  var email  = document.getElementById('email').value.trim();

  btn.disabled = true;
  btn.textContent = '发送中…';
  errBox.style.display = 'none';
  okBox.style.display  = 'none';

  try {
    await XWAuth.sendResetEmail(email);
    okBox.textContent = '✅ 邮件已发送！请查收邮箱，点击邮件中的链接重置密码';
    okBox.style.display = 'block';
    btn.textContent = '已发送';
  } catch (err) {
    errBox.textContent = err.message || '发送失败，请稍后重试';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '发送重置邮件';
  }
});

// 设置新密码
document.getElementById('reset-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn       = document.getElementById('reset-btn');
  var errBox    = document.getElementById('err-box2');
  var newpwd    = document.getElementById('newpwd').value;
  var confirmpwd = document.getElementById('confirmpwd').value;

  errBox.style.display = 'none';

  if (newpwd !== confirmpwd) {
    errBox.textContent = '两次输入的密码不一致';
    errBox.style.display = 'block';
    return;
  }
  if (newpwd.length < 6) {
    errBox.textContent = '密码至少需要6位';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '更新中…';

  try {
    await XWAuth.updatePassword(newpwd);
    document.getElementById('reset-state').style.display = 'none';
    document.getElementById('done-state').style.display  = 'block';
  } catch (err) {
    errBox.textContent = err.message || '更新失败，请重新点击邮件中的链接';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '确认修改';
  }
});
</script>
</body>
</html>
