<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兑换码 · 求学少年</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #243047;
  --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
  --green: #059669; --accent: #0284c7;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem 1rem;
}
a { color: inherit; text-decoration: none; }
.back {
  position: fixed; top: 1.2rem; left: 1.5rem;
  font-size: .83rem; color: var(--muted);
  padding: .38rem .85rem; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border);
  transition: color .15s;
}
.back:hover { color: var(--text); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem;
  width: 100%; max-width: 420px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
}
.logo { font-size: 2.4rem; text-align: center; margin-bottom: .9rem; }
h1 { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: .3rem; }
.sub { text-align: center; color: var(--muted); font-size: .82rem; margin-bottom: 2rem; }

/* 用户信息栏 */
.user-bar {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: .9rem 1.1rem;
  display: flex; align-items: center; gap: .8rem;
  margin-bottom: 1.8rem;
}
.user-bar .avatar { font-size: 1.5rem; flex-shrink: 0; }
.user-bar .info { flex: 1; min-width: 0; }
.user-bar .email { font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-bar .status { font-size: .75rem; margin-top: .15rem; }
.status-vip { color: #fbbf24; }
.status-free { color: var(--muted); }

label { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
.code-input {
  display: block; width: 100%;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: .85rem 1rem;
  color: var(--text); font-size: 1rem; font-family: 'Courier New', monospace;
  letter-spacing: .08em; outline: none; transition: border-color .15s;
  margin-bottom: 1.25rem; text-transform: uppercase;
}
.code-input:focus { border-color: var(--green); }
.code-input::placeholder { color: #475569; letter-spacing: 0; font-family: inherit; text-transform: none; }
.btn {
  display: block; width: 100%; padding: .88rem;
  border: none; border-radius: 10px;
  font-size: .95rem; font-weight: 700; cursor: pointer;
  transition: opacity .15s; font-family: inherit;
  background: var(--green); color: white;
}
.btn:hover:not(:disabled) { opacity: .88; }
.btn:disabled { opacity: .5; cursor: default; }
.err-box {
  background: rgba(220,38,38,.12); border: 1px solid rgba(220,38,38,.3);
  color: #fca5a5; padding: .72rem 1rem; border-radius: 8px;
  font-size: .84rem; margin-bottom: 1.2rem; display: none;
}
/* 兑换成功状态 */
.success-state { text-align: center; display: none; }
.success-state .icon { font-size: 3.2rem; margin-bottom: 1rem; }
.success-state h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: .5rem; color: #6ee7b7; }
.success-state p { color: var(--muted); font-size: .85rem; line-height: 1.7; margin-bottom: 1.8rem; }
.unlock-badge {
  display: inline-block; background: rgba(5,150,105,.2);
  border: 1px solid rgba(5,150,105,.4); color: #6ee7b7;
  padding: .4rem 1rem; border-radius: 999px;
  font-size: .85rem; font-weight: 700; margin-bottom: 1.5rem;
}
.btn-go {
  display: block; padding: .88rem; border-radius: 10px;
  background: var(--accent); color: white; font-weight: 700;
  font-size: .95rem; text-align: center; margin-bottom: .65rem;
}
.btn-go:hover { opacity: .88; }
.hint {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem 1.1rem;
  font-size: .82rem; color: var(--muted); line-height: 1.8;
  margin-top: 1.5rem;
}
.hint strong { color: var(--text); }
</style>
</head>
<body>

<a class="back" href="index.html">← 返回首页</a>

<div class="card">
  <div class="logo">🎟️</div>
  <h1>兑换码解锁</h1>
  <p class="sub">输入购买后获得的兑换码，永久解锁课程</p>

  <!-- 主界面 -->
  <div id="main-state">
    <div class="user-bar">
      <div class="avatar">👤</div>
      <div class="info">
        <div class="email" id="user-email">加载中…</div>
        <div class="status" id="user-status">检查状态中…</div>
      </div>
    </div>

    <div id="err-box" class="err-box"></div>

    <form id="form">
      <label for="code">兑换码</label>
      <input class="code-input" type="text" id="code"
             placeholder="XW-XXXX-XXXX" maxlength="20" required>
      <button class="btn" id="btn" type="submit">🎟️ 立即兑换</button>
    </form>

    <div class="hint">
      <strong>怎么获取兑换码？</strong><br>
      在小红书搜索「求学少年」→ 购买课程 → 收到私信兑换码<br>
      ¥9.9 四门课全解锁 · ¥3.9 单科解锁 · 永久有效
    </div>
  </div>

  <!-- 兑换成功 -->
  <div id="success-state" class="success-state">
    <div class="icon">🎉</div>
    <h2>解锁成功！</h2>
    <p>以下内容已永久解锁</p>
    <div class="unlock-badge" id="unlock-badge">基础医学四门课</div>
    <a href="index.html" class="btn-go">开始学习 →</a>
    <a href="account.html" style="display:block;text-align:center;color:var(--muted);font-size:.84rem">查看我的账号</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
// 未登录跳转
if (!XWAuth.isLoggedIn()) {
  location.replace('login.html?next=' + encodeURIComponent(location.href));
}

// 加载用户信息
(async function () {
  var sess = XWAuth.getSess();
  var emailEl = document.getElementById('user-email');
  var statusEl = document.getElementById('user-status');

  if (sess && sess.user) {
    emailEl.textContent = sess.user.email;
  }

  var profile = await XWAuth.getProfile();
  if (!profile) {
    statusEl.innerHTML = '<span class="status-free">状态获取失败，请刷新</span>';
    return;
  }

  if (profile.is_vip) {
    var names = (profile.unlocked || []).map(function (k) {
      return XWAuth.COURSE_NAMES[k] || k;
    }).join('、');
    statusEl.innerHTML = '<span class="status-vip">✨ 已解锁：' + (names || '课程内容') + '</span>';
  } else {
    statusEl.innerHTML = '<span class="status-free">免费用户 · 输入兑换码解锁</span>';
  }
})();

// 兑换
document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn');
  var errBox = document.getElementById('err-box');
  var code = document.getElementById('code').value.trim().toUpperCase();

  btn.disabled = true;
  btn.textContent = '兑换中…';
  errBox.style.display = 'none';

  try {
    var result = await XWAuth.redeemCode(code);
    if (result && result.success) {
      // 显示成功状态
      var badge = document.getElementById('unlock-badge');
      badge.textContent = XWAuth.COURSE_NAMES[result.type] || result.type || '课程内容';
      document.getElementById('main-state').style.display = 'none';
      document.getElementById('success-state').style.display = 'block';
    } else {
      errBox.textContent = (result && result.message) || '兑换失败，请检查兑换码';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '🎟️ 立即兑换';
    }
  } catch (err) {
    errBox.textContent = err.message || '兑换失败，请稍后重试';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '🎟️ 立即兑换';
  }
});
</script>
</body>
</html>
